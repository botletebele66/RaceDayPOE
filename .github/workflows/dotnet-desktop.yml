# CI for RaceDay: builds the API + MVC front end and runs both xUnit test projects.
#
# Why this file looks different from the GitHub template it started as:
#  - The repo has several .sln/.slnx/.csproj files in its root, so every dotnet command names the
#    solution explicitly (RaceDay.API_Part2.slnx). A bare `dotnet test` fails with MSB1011.
#  - All projects target net10.0, so the SDK must be 10.0.x (the template's 8.0.x cannot build them).
#  - RaceDay is an ASP.NET Core Web API + MVC app, not a WPF/WinForms app. There is no Windows
#    Application Packaging (.wapproj) project and no signing certificate, so the MSIX
#    restore / pfx / package / upload steps (and their placeholder variables) were removed.
#  - Tests use the EF Core in-memory provider and in-process test hosts, so no SQL Server is needed.

name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# Cancel a superseded run of the same branch/PR instead of queueing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-and-test:

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest
    timeout-minutes: 15

    env:
      Solution_Name: RaceDay.API_Part2.slnx   # API, MVC and both test projects (tests\RaceDay.APItests_Part2, tests\RaceDay.Tests_Part3)
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --configuration ${{ matrix.configuration }} --no-restore

    # Runs every test project in the solution. Each project writes its own .trx file.
    - name: Execute unit tests
      run: dotnet test $env:Solution_Name --configuration ${{ matrix.configuration }} --no-build --logger trx --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.configuration }}
        path: TestResults
        if-no-files-found: ignore
